body:
  text: 鈍吟雜録總目雜家類六雜編之屬卷一家戒上卷二家戒下卷三正俗卷四讀古淺說卷五嚴氏糾謬卷六日記卷七誡子帖附社約卷八遺言卷九通鑑綱目糾繆卷十將死之鳴臣等謹案鈍吟雜録十卷國朝馮班撰班字定逺號鈍吟居士常熟人卷首自署曰上黨從郡望也是書凡家戒二卷正俗一卷讀古淺說一卷嚴氏糾繆一卷日記一卷誡子帖一卷遺言一卷通鑑綱目糾繆一卷將死之鳴一卷班著述頗多殁後大半散佚其猶子武搜求遺藁僅得九種裒而成編家戒多涉厯世故之言其論明末儒者之弊頗為深切正俗皆論詩法讀古淺說多評詩文日記多說筆法字學皆間附雜論嚴氏糾繆辨嚴羽滄浪詩話之非誡子帖多評古帖論筆法末附以社約四則皆論讀書之法遺言將死之鳴皆與家戒相出入綱目糾繆未成書僅標識五條武録而存之耳大扺明季諸儒守正者多迂騖名者多詐明季詩文沿王李鍾談之餘波僞體競出故班諸書之中詆斥或傷之過激然班學有本原論事多達物情論文皆究古法雖間有偏駁要所得者為多也乾隆四十四年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:5a97403f72c3b6a008ef8407313eeb087cbc9cc48a581a0c530a779d7cdadcc7
